<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Globule, labo lactate</title>
<meta name="theme-color" content="#F3E3FF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1A0633" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Globule">
<link rel="icon" href="favicon.ico" sizes="48x48">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bowlby+One&family=Caveat+Brush&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --rose:#FF2D8E; --violet:#6A2BF0; --menthe:#3FE8B9; --jaune:#FFE45C; --sang:#E8173F;
  --ink:#2A0A4A;
  --bg-a:#E9D5FF; --bg-b:#F8D9F0; --bg-c:#FFC4E1;
  --surface:#FFFFFF; --surface-2:#FBF3FF;
  --text:#2A0A4A; --muted:#6E5A8A; --line:#2A0A4A; --shadow:#2A0A4A;
  --z1:#3FE8B9; --z2:#7CC8FF; --z3:#B98CFF; --z4:#FF8FC4; --z5:#FF2D8E;
  --f-display:"Bowlby One", "Arial Black", Impact, system-ui, sans-serif;
  --f-body:"Outfit", -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-hand:"Caveat Brush", "Comic Sans MS", "Marker Felt", cursive;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg-a:#1A0633; --bg-b:#260A45; --bg-c:#3A0B42;
    --surface:#2C1150; --surface-2:#351760;
    --text:#F8EEFF; --muted:#C9B6E6; --line:#0B0218; --shadow:#0B0218;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg-a:#1A0633; --bg-b:#260A45; --bg-c:#3A0B42;
  --surface:#2C1150; --surface-2:#351760;
  --text:#F8EEFF; --muted:#C9B6E6; --line:#0B0218; --shadow:#0B0218;
  color-scheme: dark;
}
:root{ box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); }
*,*::before,*::after{ box-sizing:inherit; }
html{ scroll-padding-top:env(safe-area-inset-top,0px); -webkit-text-size-adjust:100%; }
html,body{ margin:0; }
body{
  min-height:100vh; font-family:var(--f-body); font-size:16px; line-height:1.45; color:var(--text);
  background:linear-gradient(172deg,var(--bg-a) 0%,var(--bg-b) 55%,var(--bg-c) 100%) fixed;
  background-color:var(--bg-a);
  padding-bottom:calc(92px + env(safe-area-inset-bottom,0px));
}
body::before{ content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top,0px); z-index:30; background:var(--bg-a); }
button,input,select,textarea{ font:inherit; color:inherit; }
:focus-visible{ outline:3px solid var(--violet); outline-offset:2px; }
.wrap{ max-width:560px; margin:0 auto; padding:0 16px; }

/* En-tête */
.top{ display:flex; align-items:center; justify-content:space-between; padding:14px 0 6px; }
.wordmark{ font-family:var(--f-display); font-size:30px; letter-spacing:.5px; color:var(--rose);
  text-shadow:3px 3px 0 var(--ink); -webkit-text-stroke:1.5px var(--ink); line-height:1; margin:0; }
.wordmark small{ display:block; font-family:var(--f-hand); font-size:18px; color:var(--violet); -webkit-text-stroke:0; text-shadow:none; margin-top:4px; letter-spacing:0; }
.demo-badge{ font-family:var(--f-hand); font-size:16px; background:var(--jaune); color:var(--ink); border:2px solid var(--ink); border-radius:12px; padding:2px 10px; transform:rotate(3deg); }

/* Globule + bulle */
.hero{ display:flex; align-items:flex-end; gap:6px; margin:6px 0 14px; }
.hero .globule{ flex:none; }
.hero .globule{ margin-left:-8px; }
.bubble{ position:relative; flex:1; background:var(--surface); border:2.5px solid var(--line); border-radius:22px 22px 22px 6px;
  padding:12px 14px; font-family:var(--f-hand); font-size:21px; line-height:1.2; box-shadow:3px 3px 0 var(--shadow); margin-bottom:62px; }
.bubble::before{ content:""; position:absolute; left:-12px; bottom:10px; width:16px; height:16px; background:var(--surface);
  border-left:2.5px solid var(--line); border-bottom:2.5px solid var(--line); transform:skewY(30deg) rotate(10deg); }
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .globule{ filter:drop-shadow(0 0 7px rgba(255,190,230,.35)); } }

/* Blocs */
h2.title{ font-family:var(--f-display); font-size:22px; margin:22px 0 10px; line-height:1.1; }
.panel{ background:var(--surface); border:2.5px solid var(--line); border-radius:20px; box-shadow:4px 4px 0 var(--shadow); padding:14px; }
.panel + .panel{ margin-top:14px; }
.muted{ color:var(--muted); }
.hand{ font-family:var(--f-hand); font-size:20px; line-height:1.2; }

/* Zones : le thermomètre */
.zones{ padding:16px 14px 14px; }
.zones h3{ font-family:var(--f-display); font-size:18px; margin:0 0 12px; }
.thermo{ position:relative; display:flex; height:46px; border:2.5px solid var(--line); border-radius:999px; overflow:hidden; }
.thermo div{ display:flex; align-items:center; justify-content:center; font-family:var(--f-display); font-size:17px; color:var(--ink); }
.thermo .zi{ flex:none; height:100%; } .thermo .zi + .zi{ border-left:2.5px solid var(--line); }
.thermo .zi span{ position:relative; z-index:2; }
.gz-band.solid{ background:#FFC21A; }
.gz-legend{ display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; margin:2px 0 10px; }
.gz-legend .what{ display:flex; align-items:center; gap:8px; font-weight:700; font-size:14px; }
.gz-legend .sw{ width:26px; height:16px; border:2px solid var(--line); border-radius:5px; flex:none; }
.gz-legend .sw.solid{ background:#FFC21A; }
.zrow .ref{ display:block; font-size:12px; color:var(--muted); font-weight:500; }
.zones-note{ font-size:12px; color:var(--muted); margin:10px 0 0; }
.marks{ position:relative; height:44px; margin-top:4px; }
.mark{ position:absolute; top:0; transform:translateX(-50%); text-align:center; white-space:nowrap; }
.mark b{ display:block; font-family:var(--f-display); font-size:16px; line-height:1.1; }
.mark span{ font-size:12px; color:var(--muted); }
.zone-rows{ margin-top:10px; display:grid; gap:8px; }
.zrow{ display:grid; grid-template-columns:34px 1fr auto; align-items:center; gap:10px; }
.zdot{ width:34px; height:34px; border-radius:50%; border:2.5px solid var(--line); display:grid; place-items:center; font-family:var(--f-display); font-size:14px; color:var(--ink); }
.zrow .what{ font-size:14px; color:var(--muted); line-height:1.25; }
.zrow .what strong{ color:var(--text); display:block; font-size:15px; }
.zrow .val{ text-align:right; font-weight:700; font-variant-numeric:tabular-nums; }
.zrow .val small{ display:block; font-weight:500; color:var(--muted); font-size:12px; }
.extras{ display:flex; gap:8px; flex-wrap:wrap; margin-top:12px; }
.chip{ border:2px solid var(--line); border-radius:999px; padding:4px 10px; font-size:13px; font-weight:600; background:var(--surface-2); }
.chip b{ font-variant-numeric:tabular-nums; }
.warn{ margin-top:10px; font-size:14px; background:var(--jaune); color:var(--ink); border:2px solid var(--ink); border-radius:12px; padding:8px 10px; }

/* Boutons */
.actions{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin:16px 0 4px; }
.btn{ appearance:none; border:2.5px solid var(--line); background:var(--surface); border-radius:999px; padding:11px 14px; font-weight:700;
  box-shadow:3px 3px 0 var(--shadow); cursor:pointer; touch-action:manipulation; transition:transform .08s, box-shadow .08s; }
.btn:active{ transform:translate(3px,3px); box-shadow:0 0 0 var(--shadow); }
.btn.big{ border-radius:18px; padding:12px 6px; display:flex; flex-direction:column; align-items:center; gap:2px; font-size:14px; line-height:1.15; }
.btn.big .ico{ font-family:var(--f-display); font-size:22px; line-height:1; }
.btn.rose{ background:var(--rose); color:#fff; } .btn.violet{ background:var(--violet); color:#fff; } .btn.menthe{ background:var(--menthe); color:var(--ink); } .btn.jaune{ background:var(--jaune); color:var(--ink);}
.btn.ghost{ box-shadow:none; background:transparent; }
.btn.danger{ background:transparent; color:var(--sang); border-color:var(--sang); box-shadow:none; }
.btn.block{ width:100%; }
.row-btns{ display:flex; gap:10px; margin-top:14px; }
.row-btns .btn{ flex:1; }

/* Listes */
.list{ background:var(--surface); border:2.5px solid var(--line); border-radius:18px; overflow:hidden; box-shadow:4px 4px 0 var(--shadow); }
.item{ display:grid; grid-template-columns:44px 1fr auto; gap:10px; align-items:center; width:100%; text-align:left; padding:11px 12px; background:none; border:0; border-bottom:2px dashed color-mix(in srgb, var(--line) 25%, transparent); cursor:pointer; }
.item:last-child{ border-bottom:0; }
.item .badge{ width:44px; height:44px; border-radius:14px; border:2.5px solid var(--line); display:grid; place-items:center; font-family:var(--f-display); font-size:13px; color:var(--ink); line-height:1; text-align:center; }
.item .main{ min-width:0; }
.item .main strong{ display:block; font-size:15px; }
.item .main span{ display:block; font-size:13px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.item .num{ text-align:right; font-weight:700; font-variant-numeric:tabular-nums; }
.item .num small{ display:block; font-weight:500; font-size:12px; color:var(--muted); }
.month{ font-family:var(--f-hand); font-size:22px; margin:18px 4px 6px; color:var(--violet); }
.empty{ text-align:center; padding:22px 14px; }
.empty .hand{ margin-bottom:12px; }

/* Graphiques */
.chart{ width:100%; height:auto; display:block; overflow:visible; }
.chart text{ font-family:var(--f-body); font-size:10.5px; fill:var(--muted); }
.chart .axis{ stroke:var(--muted); stroke-opacity:.35; stroke-width:1; }
.chart .hit{ cursor:pointer; }
.chart .hit:focus-visible{ outline:none; stroke:var(--violet); stroke-width:3; }
.chart .grid{ stroke:var(--muted); stroke-opacity:.15; stroke-width:1; }
.legend{ display:flex; flex-wrap:wrap; gap:6px 14px; font-size:13px; margin-top:8px; }
.legend i{ display:inline-block; width:14px; height:4px; border-radius:2px; vertical-align:middle; margin-right:6px; }
.tap-hint{ font-size:13px; color:var(--muted); margin-top:6px; }

/* Onglets */
.tabbar{ position:fixed; left:0; right:0; bottom:0; z-index:40; padding:8px 12px calc(10px + env(safe-area-inset-bottom,0px));
  background:color-mix(in srgb, var(--bg-c) 82%, transparent); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); border-top:2.5px solid var(--line); }
.tabbar .inner{ max-width:560px; margin:0 auto; display:grid; grid-template-columns:repeat(3,1fr); gap:6px; }
.tab{ appearance:none; border:2.5px solid transparent; background:none; border-radius:16px; padding:6px 2px 5px; display:flex; flex-direction:column; align-items:center; gap:2px; font-size:12px; font-weight:600; cursor:pointer; color:var(--text); }
.tab svg{ width:24px; height:24px; }
.tab[aria-current="page"]{ background:var(--rose); color:#fff; border-color:var(--line); box-shadow:2px 2px 0 var(--shadow); }

/* Feuille modale */
.backdrop{ position:fixed; inset:0; z-index:50; background:rgba(26,6,51,.45); display:flex; align-items:flex-end; justify-content:center; animation:fade .15s ease-out; }
.sheet{ width:100%; max-width:560px; max-height:calc(100% - 24px - env(safe-area-inset-top,0px)); overflow-y:auto; -webkit-overflow-scrolling:touch;
  background:var(--surface); border:2.5px solid var(--line); border-bottom:0; border-radius:26px 26px 0 0; padding:10px 16px calc(22px + env(safe-area-inset-bottom,0px)); animation:up .22s cubic-bezier(.2,.9,.3,1.1); }
.sheet .grab{ width:44px; height:5px; border-radius:3px; background:var(--muted); opacity:.4; margin:2px auto 8px; }
.sheet h3{ font-family:var(--f-display); font-size:22px; margin:4px 0 12px; display:flex; align-items:center; justify-content:space-between; gap:10px; }
.sheet h3 .x{ font-family:var(--f-body); font-size:15px; font-weight:600; }
@keyframes up{ from{ transform:translateY(40px); opacity:.4; } to{ transform:none; opacity:1; } }
@keyframes fade{ from{ opacity:0; } to{ opacity:1; } }
@media (prefers-reduced-motion: reduce){ .sheet,.backdrop{ animation:none; } }

/* Formulaires */
.field{ display:block; margin-bottom:12px; }
.field > span{ display:block; font-size:13px; font-weight:600; color:var(--muted); margin-bottom:4px; }
.inp{ width:100%; border:2.5px solid var(--line); border-radius:14px; padding:10px 12px; background:var(--surface-2); font-size:16px; min-height:46px; }
textarea.inp{ min-height:70px; resize:vertical; }
.grid2{ display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:10px; }
.grid2 > *, .grid3 > *{ min-width:0; }
input.inp[type="date"]{ -webkit-appearance:none; appearance:none; display:block; min-width:0; max-width:100%; text-align:left; }
input.inp[type="date"]::-webkit-date-and-time-value{ text-align:left; }
.grid3{ display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:10px; }
.seg{ display:flex; border:2.5px solid var(--line); border-radius:14px; overflow:hidden; }
.seg button{ flex:1; border:0; background:var(--surface-2); padding:10px 6px; font-weight:600; cursor:pointer; min-height:44px; }
.seg button + button{ border-left:2.5px solid var(--line); }
.seg button[aria-pressed="true"]{ background:var(--violet); color:#fff; }
.rpe{ display:grid; grid-template-columns:repeat(10,1fr); gap:4px; }
.rpe button{ border:2px solid var(--line); border-radius:10px; background:var(--surface-2); padding:8px 0; font-weight:700; cursor:pointer; min-height:40px; }
.rpe button[aria-pressed="true"]{ background:var(--rose); color:#fff; }
.proto-line{ font-size:14px; background:var(--surface-2); border:2px dashed var(--line); border-radius:12px; padding:8px 10px; margin:0 0 10px; }
.steps-head,.step-row{ display:grid; grid-template-columns:22px 1fr 1fr 1fr 1fr 30px; gap:6px; align-items:center; }
.steps-head{ font-size:12px; font-weight:600; color:var(--muted); margin-bottom:4px; }
.step-row{ margin-bottom:6px; }
.step-row .n{ font-family:var(--f-display); font-size:13px; text-align:center; }
.step-row .inp{ padding:8px 6px; text-align:center; min-height:42px; border-radius:11px; }
.step-row .del{ border:0; background:none; font-size:20px; color:var(--muted); cursor:pointer; padding:0; }
.result{ background:var(--surface-2); border:2.5px dashed var(--line); border-radius:16px; padding:12px; margin:12px 0; }
.result .big{ font-family:var(--f-display); font-size:26px; line-height:1.1; }
.kv{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
.kv div{ background:var(--surface-2); border:2px solid var(--line); border-radius:14px; padding:8px; text-align:center; }
.kv b{ display:block; font-family:var(--f-display); font-size:19px; }
.kv span{ font-size:12px; color:var(--muted); }
.err{ color:var(--sang); font-weight:600; font-size:14px; margin-top:8px; }


/* Golden Zone */
.gz-band{ position:absolute; top:0; bottom:0; border-left:2px solid var(--line); border-right:2px solid var(--line); }
.gz-band.low{ background:repeating-linear-gradient(135deg,#FFE07A 0 6px,#FFF3C2 6px 12px); }
.gz-band.high{ background:repeating-linear-gradient(135deg,#FFB000 0 6px,#FFD45A 6px 12px); }
.golden{ position:relative; overflow:hidden; margin-top:14px; color:#2A0A4A; background:linear-gradient(140deg,#FFE680 0%,#FFC21A 55%,#FFAE00 100%); }
.golden::after{ content:""; position:absolute; top:0; bottom:0; width:40%; left:-60%; background:linear-gradient(100deg,transparent,rgba(255,255,255,.65),transparent); transform:skewX(-18deg); animation:sheen 1.6s .5s ease-out 1 both; pointer-events:none; }
@keyframes sheen{ to{ left:130%; } }
@media (prefers-reduced-motion: reduce){ .golden::after{ display:none; } }
.gz-head{ display:flex; align-items:center; gap:8px; }
.gz-head h3{ font-family:var(--f-display); font-size:18px; margin:0; }
.gz-star{ font-size:24px; line-height:1; color:#fff; -webkit-text-stroke:1.5px #2A0A4A; }
.gz-rows{ display:grid; gap:10px; margin-bottom:12px; }
.gz-row{ display:grid; grid-template-columns:64px 1fr; gap:10px; align-items:center; background:rgba(255,255,255,.55); border:2px solid #2A0A4A; border-radius:16px; padding:8px 10px; }
.gz-tag{ font-family:var(--f-display); font-size:13px; text-align:center; border:2px solid #2A0A4A; border-radius:999px; padding:3px 0; }
.gz-tag.low{ background:#FFE07A; } .gz-tag.high{ background:#FF9F00; color:#fff; -webkit-text-stroke:.6px #2A0A4A; }
.gz-w{ display:block; font-family:var(--f-display); font-size:22px; line-height:1.1; }
.gz-row small{ display:block; font-size:13px; color:#5A3D00; font-weight:600; }
.gz-watts{ font-family:var(--f-display); font-size:36px; line-height:1.05; margin-top:8px; color:#fff; -webkit-text-stroke:1.5px #2A0A4A; text-shadow:3px 3px 0 #2A0A4A; }
.gz-sub{ margin:4px 0 12px; font-weight:700; font-size:14px; }
.golden .kv div{ background:rgba(255,255,255,.6); border-color:#2A0A4A; }
.golden .kv span{ color:#5A3D00; }
.gz-note{ font-size:13px; margin:10px 0 12px; color:#5A3D00; }
.golden .btn{ background:#fff; color:#2A0A4A; border-color:#2A0A4A; box-shadow:3px 3px 0 #2A0A4A; }
.gz-result{ background:#FFF1B8; color:#2A0A4A; border-color:#C98A00; margin-top:0; }
.golden-proto{ background:linear-gradient(140deg,#FFF3C2,#FFE07A); color:#2A0A4A; }
.golden-proto summary .s, .golden-proto .say{ color:#7A4E00; }
.item .badge.gz{ line-height:1.05; }

/* Protocoles */
.proto{ margin-top:14px; }
.proto summary{ list-style:none; cursor:pointer; display:flex; align-items:center; gap:12px; }
.proto summary::-webkit-details-marker{ display:none; }
.proto summary .t, .proto summary .s{ display:block; }
.proto summary .t{ font-family:var(--f-display); font-size:18px; line-height:1.15; }
.proto summary .s{ font-size:13px; color:var(--muted); }
.proto summary .plus{ margin-left:auto; font-family:var(--f-display); font-size:22px; transition:transform .15s; }
.proto[open] summary .plus{ transform:rotate(45deg); }
.proto .say{ font-family:var(--f-hand); font-size:20px; line-height:1.2; margin:12px 0 8px; color:var(--violet); }
.proto ol{ padding-left:20px; margin:8px 0; } .proto li{ margin-bottom:6px; }
.formula{ background:var(--surface-2); border:2px solid var(--line); border-radius:12px; padding:8px 10px; font-weight:600; margin:8px 0; overflow-x:auto; }

/* Connexion */
.login{ max-width:420px; margin:6vh auto 0; text-align:center; }
.login .globule{ margin:0 auto; display:block; }
.login .panel{ text-align:left; margin-top:14px; }
.toast{ position:fixed; left:50%; bottom:calc(96px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%); z-index:60; background:var(--ink); color:#fff; border-radius:999px; padding:10px 18px; font-weight:600; box-shadow:3px 3px 0 var(--rose); }
.tpl-row{ display:flex; align-items:center; border-bottom:2px dashed color-mix(in srgb, var(--line) 25%, transparent); }
.tpl-row:last-child{ border-bottom:0; }
.tpl-row .item{ flex:1; border-bottom:0; }
.tpl-row .del{ border:0; background:none; font-size:22px; color:var(--muted); cursor:pointer; padding:0 14px; min-height:44px; }
.sr{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); }

.sport-switch{ margin:0 0 12px; }
.sport-pick{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:12px; }
.sport-pick .btn{ border-radius:18px; padding:14px 8px; display:flex; flex-direction:column; align-items:center; gap:2px; font-size:16px; }
.sport-pick .btn small{ font-size:12px; font-weight:500; opacity:.85; }
.login-lang{ max-width:220px; margin:0 auto 8px; }
.login-lang .seg button{ min-height:34px; padding:6px; font-size:13px; }
.tuto-step{ position:relative; }
.tuto-n{ display:block; font-family:var(--f-body); font-size:12px; font-weight:700; color:var(--muted); margin-bottom:2px; }
.tuto-ico{ position:absolute; right:6px; bottom:-10px; width:44px; height:44px; border-radius:14px; border:2.5px solid var(--line); background:var(--jaune); color:var(--ink);
  display:grid; place-items:center; font-weight:800; font-size:20px; box-shadow:2px 2px 0 var(--shadow); animation:pop 360ms var(--ease-out) 120ms both; }
.tuto-dots{ display:flex; justify-content:center; gap:6px; margin:18px 0 4px; }
.tuto-dots i{ width:8px; height:8px; border-radius:50%; background:var(--line); opacity:.25; transition:opacity 240ms var(--ease-out), scale 240ms var(--ease-out); }
.tuto-dots i.on{ opacity:1; scale:1.3; background:var(--rose); }
.tpl-steps{ display:flex; flex-wrap:wrap; gap:6px; }
/* ---------- Mouvement ---------- */
:root{
  --ease-out:cubic-bezier(.23,1,.32,1);   /* entrées et déplacements */
  --t-menu:200ms;                          /* menus déroulants : 150 à 250 ms */
  --t-in:260ms;                            /* entrées */
  --t-out:210ms;                           /* sorties : environ 20 % plus courtes */
}
/* Appui : on réduit à 0,97 */
.btn{ transition:transform 140ms var(--ease-out), box-shadow 140ms var(--ease-out), background-color 220ms var(--ease-out), color 220ms var(--ease-out); }
.btn:active{ transform:translate(3px,3px) scale(.97); }
.item, .tab, .seg button, .rpe button, .del, .proto summary{ transition:transform 140ms var(--ease-out), background-color 240ms var(--ease-out), color 240ms var(--ease-out); }
.item:active, .tab:active, .seg button:active, .rpe button:active, .del:active{ transform:scale(.97); }
/* Changements de couleur avec du poids */
.rpe button[aria-pressed="true"]{ animation:pop 300ms var(--ease-out); }
@keyframes pop{ 0%{ scale:.88; } 60%{ scale:1.04; } 100%{ scale:1; } }

/* Pastille partagée (onglets, segments) : même layout ID, rebond élastique */
.pill{ position:absolute; left:0; top:0; z-index:0; box-sizing:border-box; pointer-events:none; transform-origin:50% 50%; }
.tabbar .inner{ position:relative; }
.tabbar .tab{ position:relative; z-index:1; }
.tabbar .pill{ border-radius:16px; background:var(--rose); border:2.5px solid var(--line); box-shadow:2px 2px 0 var(--shadow); }
.tabbar .inner.has-pill .tab[aria-current="page"]{ background:none; border-color:transparent; box-shadow:none; }
.seg.has-pill{ position:relative; background:var(--surface-2); }
.seg.has-pill button{ position:relative; z-index:1; background:transparent; }
.seg.has-pill button[aria-pressed="true"]{ background:transparent; }
.seg .pill{ background:var(--violet); }

/* Feuilles : entrée depuis l'élément touché, à l'échelle 0,95, sortie vers lui */
.backdrop{ animation:fade var(--t-in) var(--ease-out); }
.backdrop.leaving{ animation:fade-out var(--t-out) var(--ease-out) forwards; pointer-events:none; }
.sheet{ animation:sheet-in var(--t-in) var(--ease-out) both; }
.sheet.leaving{ position:absolute; left:0; right:0; bottom:0; margin:0 auto; pointer-events:none; animation:sheet-out var(--t-out) var(--ease-out) forwards; }
@keyframes sheet-in{ from{ opacity:0; transform:scale(.95); } to{ opacity:1; transform:none; } }
@keyframes sheet-out{ from{ opacity:1; transform:none; } to{ opacity:0; transform:scale(.95); } }
@keyframes fade-out{ to{ opacity:0; } }

/* Changement d'onglet : le nouvel écran entre pendant que l'ancien s'en va */
.view-ghost{ position:fixed; margin:0; z-index:1; pointer-events:none; animation:view-out var(--t-out) var(--ease-out) forwards; }
@keyframes view-out{ to{ opacity:0; transform:translateY(-6px); filter:blur(2px); } }

/* Menus déroulants : icône + / − en fondu enchaîné avec échelle et flou */
.proto summary .plus{ position:relative; width:22px; height:22px; flex:none; font-size:0; transform:none !important; transition:none; }
.proto summary .plus::before, .proto summary .plus::after{ position:absolute; inset:0; display:grid; place-items:center; font-family:var(--f-display); font-size:22px; line-height:1;
  transition:opacity var(--t-menu) var(--ease-out), scale var(--t-menu) var(--ease-out), filter var(--t-menu) var(--ease-out); }
.proto summary .plus::before{ content:"+"; }
.proto summary .plus::after{ content:"\2212"; opacity:0; scale:.5; filter:blur(4px); }
.proto[open]:not(.closing) summary .plus::before{ opacity:0; scale:.5; filter:blur(4px); }
.proto[open]:not(.closing) summary .plus::after{ opacity:1; scale:1; filter:blur(0); }

/* Toast : arrive en courbe, petite pulsation quand c'est réussi */
.toast{ display:flex; align-items:center; gap:8px; white-space:nowrap; animation:toast-in var(--t-in) var(--ease-out) both; }
.toast.ok{ animation:toast-in var(--t-in) var(--ease-out) both, pulse 380ms var(--ease-out) var(--t-in); }
.toast.leaving{ animation:toast-out var(--t-out) var(--ease-out) forwards; }
.toast .tick{ display:grid; place-items:center; width:22px; height:22px; border-radius:50%; background:var(--menthe); color:var(--ink); font-size:13px; animation:icon-in 320ms var(--ease-out) 120ms both; }
@keyframes toast-in{ 0%{ opacity:0; translate:-18px 28px; } 60%{ opacity:1; translate:-4px -3px; } 100%{ translate:0 0; } }
@keyframes toast-out{ to{ opacity:0; translate:0 14px; scale:.95; } }
@keyframes pulse{ 0%{ scale:1; } 45%{ scale:1.07; } 100%{ scale:1; } }
@keyframes icon-in{ from{ opacity:0; scale:.4; filter:blur(4px); } to{ opacity:1; scale:1; filter:blur(0); } }

@media (prefers-reduced-motion: reduce){
  *, *::before, *::after{ animation-duration:.01ms !important; animation-delay:0ms !important; transition-duration:.01ms !important; }
}

  if (!group || !group.offsetParent) return;
  const id = group.dataset.layoutId || 'seg:' + (group.dataset.seg || '');

  if (RM() || !root) return;

// Menus déroulants (protocoles) : 200 ms à l'ouverture, 160 ms à la fermeture
document.addEventListener('click', e => {
  const sum = e.target.closest('details.proto > summary');
  if (!sum || RM()) return;
  e.preventDefault();
  const d = sum.parentElement;
  const from = d.offsetHeight;
  if (d._anim) d._anim.cancel();
  const tok = d._tok = {};
  const wasOpen = d.open;
  d.open = false; const closed = d.offsetHeight; d.open = true; const full = d.offsetHeight;
  d.style.overflow = 'hidden';
  const done = () => { d.style.overflow = ''; d.style.height = ''; d.classList.remove('closing'); d._anim = null; };
  if (wasOpen) {
    d.classList.add('closing');
    const dur = Math.round(T_MENU * .8);
    d._anim = d.animate({ height: [from + 'px', closed + 'px'] }, { duration: dur, easing: EASE_OUT, fill: 'forwards' });
    setTimeout(() => { if (d._tok !== tok) return; d.open = false; d._anim.cancel(); done(); }, dur);
  } else {
    d.classList.remove('closing');
    d._anim = d.animate({ height: [from + 'px', full + 'px'] }, { duration: T_MENU, easing: EASE_OUT });
    setTimeout(() => { if (d._tok === tok) done(); }, T_MENU);
    $$(':scope > :not(summary)', d).forEach((c, i) => c.animate([{ opacity: 0, transform: 'translateY(-6px)' }, { opacity: 1, transform: 'none' }],
      { duration: T_MENU, delay: i * STAGGER, easing: EASE_OUT, fill: 'backwards' }));
  }
});

function toast(msg, ok) {
  $$('.toast:not(.leaving)').forEach(o => { o.classList.add('leaving'); later(() => o.remove(), T_OUT + 40); });

  t.className = 'toast' + (ok ? ' ok' : ''); t.setAttribute('role', 'status');

}

const Local = {

  list(t) { try { return JSON.parse(localStorage.getItem(this.key(t)) || '[]'); } catch { return []; } },
  save(t, rows) { try { localStorage.setItem(this.key(t), JSON.stringify(rows)); } catch { /* stockage plein ou bloqué */ } },
  async all(t) { return this.list(t).sort(byDateDesc); },
  async insert(t, row) { const rows = this.list(t); const r = { ...row, id: uid(), created_at: new Date().toISOString() }; rows.push(r); this.save(t, rows); return r; },

  async all(t) { const { data, error } = await sb.from(t).select('*').order('date', { ascending: false }).order('created_at', { ascending: false }); if (error) throw error; return data || []; },

// LT1 auto : palier qui précède le premier saut >= 0,4 mmol. Confirmé si le palier suivant reste au-dessus.
// LT2 auto : Dmax modifiée (courbe lissée en polynôme de degré 3, point le plus éloigné de la corde LT1 -> dernier palier).
function analyzeSteps(test) {
  const steps = ((test.data && test.data.steps) || [])
    .map(s => ({ w: num(s.w), hr: num(s.hr), la: num(s.la), rpe: num(s.rpe) }))
    .filter(s => s.w != null && s.la != null)
    .sort((a, b) => a.w - b.w);
  let auto = null, firstAny = null;
  for (let i = 1; i < steps.length; i++) {
    if (steps[i].la - steps[i - 1].la >= 0.4 - 1e-9) {
      const confirmed = i + 1 < steps.length && steps[i + 1].la - steps[i - 1].la >= 0.4 - 1e-9;
      const cand = { idx: i - 1, jumpIdx: i, confirmed };
      if (!firstAny) firstAny = cand;
      if (confirmed) { auto = cand; break; }

  }
  auto = auto || firstAny;
  const autoW = auto ? steps[auto.idx].w : null;

  const ref = lt1W != null ? steps.find(s => s.w === lt1W) : null;
  const mIdx = manualW != null ? steps.findIndex(s => s.w === manualW) : -1;

    steps, auto, autoW, manualW, lt1W,

}

    [A[c], A[piv]] = [A[piv], A[c]];

  { n: 4, get name() { return T('Au-dessus du seuil', 'Above threshold'); }, get what() { return T('Au-delà de LT2, le lactate grimpe sans plateau.', 'Past LT2, lactate keeps climbing with no plateau.'); }, get ref() { return T('4 à 6 mmol', '4 to 6 mmol'); } },

const MASCOT_STATES = ['is-idle', 'is-hello', 'is-golden', 'is-high', 'is-record'];
function globuleSVG(size = 120, cls = '') {
  const n = ++gid;

    .replace(/url\(#([^)]+)\)/g, (m, id) => `url(#${id}-${n})`)
    .replace(/aria-labelledby="([^"]+)"/, (m, id) => `aria-labelledby="${id}-${n}"`)
    .replace('width="388" height="436"', `width="${size}" height="${Math.round(size * 436 / 388)}"`)
    .replace('class="globule is-idle"', `class="globule is-idle ${cls}"`);
  return s;
}
function setMascot(svg, st) {

/* ---------- Graphiques SVG ---------- */
function niceTicks(min, max, count = 5) {
  if (!Number.isFinite(min) || !Number.isFinite(max)) { min = 0; max = 1; }
  if (min === max) { min -= 1; max += 1; }
  const step0 = (max - min) / count, mag = Math.pow(10, Math.floor(Math.log10(step0))), err = step0 / mag;
  const step = (err >= 7.5 ? 10 : err >= 3.5 ? 5 : err >= 1.5 ? 2 : 1) * mag;
  const lo = Math.floor(min / step) * step, hi = Math.ceil(max / step) * step, ticks = [];
  for (let v = lo; v <= hi + step / 2; v += step) ticks.push(+v.toFixed(6));
  return { lo, hi, ticks };
}
// series : [{ pts:[{x,y,attrs}], color, dash, right, dots, line }]
function chartSVG({ series, xRange, yRange, y2Range, xFmt = v => fmt(v), yFmt = v => fmt(v, 1), y2Fmt = v => fmt(v), xTitle = '', yTitle = '', y2Title = '', h = 220, vlines = [], hbands = [], timeX = false, extra = '' }) {
  const W = 340, P = { l: 38, r: y2Range ? 38 : 12, t: 18, b: 34 };
  const X = timeX ? { lo: xRange[0], hi: xRange[1], ticks: [] } : niceTicks(xRange[0], xRange[1], 5);
  if (timeX) { const k = 4; for (let i = 0; i < k; i++) X.ticks.push(X.lo + (X.hi - X.lo) * i / (k - 1)); }
  const Y = niceTicks(yRange[0], yRange[1], 4);
  const Y2 = y2Range ? niceTicks(y2Range[0], y2Range[1], 4) : null;
  const sx = v => P.l + (v - X.lo) / ((X.hi - X.lo) || 1) * (W - P.l - P.r);
  const sy = v => h - P.b - (v - Y.lo) / ((Y.hi - Y.lo) || 1) * (h - P.t - P.b);
  const sy2 = Y2 ? (v => h - P.b - (v - Y2.lo) / ((Y2.hi - Y2.lo) || 1) * (h - P.t - P.b)) : null;
  let g = '';
  hbands.forEach(b => {
    const top = sy(Math.min(b.y1, Y.hi)), bot = sy(Math.max(b.y0, Y.lo));
    if (bot > top) {
      g += `<rect x="${P.l}" y="${top}" width="${W - P.l - P.r}" height="${bot - top}" fill="${b.color}" opacity="${b.op || .35}"/>`;
      if (b.label) g += `<text x="${P.l + 5}" y="${top + 12}" style="fill:#8A5A00;font-weight:700">${b.label}</text>`;
    }
  });
  Y.ticks.forEach(t => { g += `<line class="grid" x1="${P.l}" x2="${W - P.r}" y1="${sy(t)}" y2="${sy(t)}"/><text x="${P.l - 6}" y="${sy(t) + 3.5}" text-anchor="end">${yFmt(t)}</text>`; });
  if (Y2) Y2.ticks.forEach(t => { g += `<text x="${W - P.r + 6}" y="${sy2(t) + 3.5}">${y2Fmt(t)}</text>`; });
  X.ticks.forEach(t => { g += `<text x="${sx(t)}" y="${h - P.b + 15}" text-anchor="middle">${xFmt(t)}</text>`; });
  g += `<line class="axis" x1="${P.l}" x2="${W - P.r}" y1="${h - P.b}" y2="${h - P.b}"/>`;
  if (xTitle) g += `<text x="${(P.l + W - P.r) / 2}" y="${h - 3}" text-anchor="middle">${xTitle}</text>`;
  if (yTitle) g += `<text x="4" y="10">${yTitle}</text>`;
  if (y2Title) g += `<text x="${W - 4}" y="10" text-anchor="end">${y2Title}</text>`;
  vlines.forEach(v => {
    const x = sx(v.x);
    g += `<line x1="${x}" x2="${x}" y1="${P.t - 6}" y2="${h - P.b}" stroke="${v.color}" stroke-width="2.5" stroke-dasharray="${v.dash || ''}"/>`;
    if (v.label) g += `<text x="${x + 4}" y="${P.t + 2}" style="fill:var(--text);font-weight:700">${v.label}</text>`;
  });

    const f = s.right ? sy2 : sy;
    const pts = s.pts.filter(p => p.x != null && p.y != null);
    if (s.line !== false && pts.length > 1) {
      g += `<polyline fill="none" stroke="${s.color}" stroke-width="${s.width || 3}" stroke-linejoin="round" stroke-linecap="round" ${s.dash ? `stroke-dasharray="${s.dash}"` : ''} points="${pts.map(p => `${sx(p.x).toFixed(1)},${f(p.y).toFixed(1)}`).join(' ')}"/>`;
    }
    if (s.dots !== false) pts.forEach(p => {
      g += `<circle cx="${sx(p.x).toFixed(1)}" cy="${f(p.y).toFixed(1)}" r="${p.r || s.r || 4.5}" fill="${p.fill || s.color}" stroke="#2A0A4A" stroke-width="2" ${p.attrs || ''}/>`;

    });

    : G.capped ? T('Plafonnée à ton LT2 : la Golden Zone reste sous ton 2e seuil, jamais dessus.', 'Capped at your LT2: the Golden Zone stays below your 2nd threshold, never above.')
    : T(`${SP().Name} et FC lues sur ta dernière courbe de lactate. Une plage, pas un chiffre : vise le bas sur les intervalles longs.`, `${SP().Name} and HR read from your latest lactate curve. A range, not a number: aim low on long intervals.`);
  return `<section class="panel golden" aria-label="${T('Ta Golden Zone', 'Your Golden Zone')}">
    <div class="gz-head"><span class="gz-star" aria-hidden="true">★</span><h3>${T('Ta Golden Zone', 'Your Golden Zone')}</h3></div>
    <p class="gz-sub">${T('Juste sous ton 2e seuil (LT2), jamais dessus.', 'Just below your 2nd threshold (LT2), never above.')}</p>
    <div class="gz-watts">${watts}</div>${isRun() && G.wLo != null ? `<div class="gz-sub" style="margin:2px 0 0">${T('Allure', 'Pace')} ${paceRange(G.wLo, G.wHi)}</div>` : ''}
    <div class="kv" style="margin:10px 0 12px">${cell(`${r(G.lo)}–${r(G.hi)}`, 'mmol/L')}${cell(hr, T('FC (bpm)', 'HR (bpm)'))}${cell(Z.lt2 != null ? fx(Z.lt2) : T('n.d.', 'n/a'), T(`LT2 (${SP().u}), plafond`, `LT2 (${SP().u}), cap`))}</div>
    <div class="kv"><div><b>${wk.n}</b><span>${T(`séance${wk.n > 1 ? 's' : ''} cette semaine`, `session${wk.n > 1 ? 's' : ''} this week`)}</span></div><div><b>${wk.min}</b><span>${T('min en GZ', 'min in GZ')}</span></div><div><b>${wk.high}</b><span>${T('trop haut', 'too high')}</span></div></div>
    <p class="gz-note">${note}</p>
    <div class="row-btns" style="margin-top:0"><button class="btn" data-act="new-gz">${T('+ Séance Golden Zone', '+ Golden Zone session')}</button></div></section>`;
}
function sessionItem(s, Z) {
  const z = zoneOf(num(s.watts), Z);
  const meta = [fdate(s.date), s.duration_min ? `${s.duration_min} min` : '', s.hr ? `${T('FC', 'HR')} ${s.hr}` : '', s.source ? SOURCES[s.source] : ''].filter(Boolean).join(', ');
  return `<button class="item" data-act="edit-session" data-id="${s.id}">
    ${gzBadge(s) || `<span class="badge" style="background:${z ? ZCOL[z] : 'var(--surface-2)'}">${z ? 'I' + z : '?'}</span>`}
    <span class="main"><strong>${esc((s.template && s.template.name ? tplLabel(s.template.name) : '') || (s.kind ? kindLabel(s.kind) : '') || T('Séance', 'Session'))}</strong><span>${esc(meta)}</span></span>
    <span class="num">${s.lactate != null ? fmt(num(s.lactate), 1) + ' mmol' : ''}<small>${s.watts != null ? fxu(num(s.watts)) : ''}</small></span></button>`;
}
function gzBadge(s) {
  const g = gzStatus(s);
  if (!g) return '';
  const look = g.st === 'high' ? ['var(--z3)', 'GZ<br>↑', '#fff'] : g.st === 'low' ? ['#FFF1B8', 'GZ<br>↓', '#2A0A4A'] : [GZ_COLOR, 'GZ', '#2A0A4A'];
  return `<span class="badge gz" style="background:${look[0]};color:${look[2]};font-size:13px" title="Golden Zone${g.st === 'high' ? T(', trop haut', ', too high') : g.st === 'low' ? T(', trop bas', ', too low') : ''}">${look[1]}</span>`;
}
function testItem(t) {
  const a = analyzeSteps(t);
  const v = w => w != null ? fx(w) : '?';
  return `<button class="item" data-act="open-steps" data-id="${t.id}">
    <span class="badge" style="background:var(--violet);color:#fff">5'</span>
    <span class="main"><strong>${T('Test paliers', 'Step test')}</strong><span>${fdate(t.date)}, ${T(`${a.steps.length} paliers`, `${a.steps.length} steps`)}${t.source ? ', ' + SOURCES[t.source] : ''}</span></span>
    <span class="num">${v(a.lt1W)} / ${v(a.lt2W)} ${SP().u}<small>LT1 / LT2</small></span></button>`;
}

    : Z.lt2 == null ? T('Il me manque ton LT2. Au prochain test, monte jusque vers 4 mmol.', "I'm missing your LT2. On your next test, go up to about 4 mmol.")

  const recent = [...state.sessions.map(s => ({ ...s, _t: 's' })), ...state.tests.filter(t => t.kind === 'steps').map(t => ({ ...t, _t: 't' }))].sort(byDateDesc).slice(0, 4);

function viewJournal() {
  const Z = currentZones();
  const withLa = state.sessions.filter(s => num(s.lactate) != null).map(s => ({ id: s.id, label: `${(s.template && s.template.name ? tplLabel(s.template.name) : '') || (s.kind ? kindLabel(s.kind) : '') || T('Séance', 'Session')}, ${fdate(s.date)}, ${fmt(num(s.lactate), 1)} mmol`, x: Date.parse(s.date), y: num(s.lactate), z: zoneOf(num(s.watts), Z), gz: (gzStatus(s) || {}).st === 'in' })).sort((a, b) => a.x - b.x);
  let chart = '';
  if (withLa.length) {
    let x0 = withLa[0].x, x1 = withLa[withLa.length - 1].x; if (x0 === x1) { x0 -= 3 * 864e5; x1 += 3 * 864e5; }
    chart = `<section class="panel" style="margin-top:16px"><h3 class="hand" style="margin:0 0 6px">${T('Lactate à l\'entraînement', 'Lactate in training')}</h3><p class="tap-hint" style="margin:0 0 4px">${T('Touche un point pour ouvrir la séance.', 'Tap a dot to open the session.')}</p>
      ${chartSVG({ timeX: true, xRange: [x0, x1], yRange: [0, Math.max(4, gzTop() + .5, ...withLa.map(p => p.y))], xFmt: v => fdateShort(new Date(v).toISOString()), yTitle: 'mmol/L', h: 190,
        hbands: gzBands(), series: [{ pts: withLa.map(p => ({ act: 'edit-session', id: p.id, label: p.label, x: p.x, y: p.y, fill: p.gz ? GZ_COLOR : p.z ? ZHEX[p.z] : '#ffffff', r: p.gz ? 7.5 : 6 })), color: '#2A0A4A', line: false }] })}
      <div class="legend">${ZONES.map(z => `<span><i style="background:${ZCOL[z.n]}"></i>I${z.n}</span>`).join('')}<span><i style="background:#FFC21A"></i>Golden Zone</span></div></section>`;
  }
  const steps = state.tests.filter(t => t.kind === 'steps');
  let trend = '';
  const l1 = steps.map(t => ({ act: 'open-steps', id: t.id, label: T(`Test du ${fdate(t.date)}`, `Test of ${fdate(t.date)}`), x: Date.parse(t.date), y: analyzeSteps(t).lt1W })).filter(p => p.y != null).sort((a, b) => a.x - b.x);
  const l2 = steps.map(t => ({ act: 'open-steps', id: t.id, label: T(`Test du ${fdate(t.date)}`, `Test of ${fdate(t.date)}`), x: Date.parse(t.date), y: analyzeSteps(t).lt2W })).filter(p => p.y != null).sort((a, b) => a.x - b.x);
  if (l1.length + l2.length >= 2) {
    const all = [...l1, ...l2], xs = all.map(p => p.x), ys = all.map(p => p.y);
    let x0 = Math.min(...xs), x1 = Math.max(...xs); if (x0 === x1) { x0 -= 7 * 864e5; x1 += 7 * 864e5; }
    trend = `<section class="panel" style="margin-top:14px"><h3 class="hand" style="margin:0 0 6px">${T('Tes seuils dans le temps', 'Your thresholds over time')}</h3><p class="tap-hint" style="margin:0 0 4px">${T('Touche un point pour ouvrir le test.', 'Tap a dot to open the test.')}</p>
      ${chartSVG({ timeX: true, xRange: [x0, x1], yRange: [Math.min(...ys) - 10, Math.max(...ys) + 10], xFmt: v => fdateShort(new Date(v).toISOString()), yFmt: v => fx(v), yTitle: SP().u, h: 170,
        series: [{ pts: l1, color: '#13B98A', r: 5.5 }, { pts: l2, color: '#FF2D8E', r: 5.5 }] })}
      <div class="legend"><span><i style="background:#13B98A"></i>LT1</span><span><i style="background:#FF2D8E"></i>LT2</span></div></section>`;
  }
  const items = [...state.sessions.map(s => ({ ...s, _t: 's' })), ...steps.map(t => ({ ...t, _t: 't' }))].sort(byDateDesc);
  const groups = {};
  items.forEach(it => { const k = (it.date || '').slice(0, 7); (groups[k] = groups[k] || []).push(it); });
  const list = Object.keys(groups).sort().reverse().map(k => {
    const [y, m] = k.split('-');
    return `<p class="month">${MONTHS[+m - 1]} ${y}</p><div class="list">${groups[k].map(it => it._t === 's' ? sessionItem(it, Z) : testItem(it)).join('')}</div>`;
  }).join('');
  return hero(items.length ? T('Séances et tests, tout au même endroit. Touche une ligne pour la voir.', 'Sessions and tests, all in one place. Tap a row to see it.') : T('Ton journal est vide. Note ta prochaine séance ou ton prochain test.', 'Your log is empty. Add your next session or your next test.'), 124) + `
    <div class="row-btns" style="margin-top:0"><button class="btn rose" data-act="new-session">${T('+ Séance', '+ Session')}</button><button class="btn violet" data-act="new-steps">${T('+ Test paliers', '+ Step test')}</button></div>
    ${chart}${trend}${list}`;
}

/* ---------- Feuilles modales ---------- */
let sheetEl = null, sheetRefresh = null;
function openSheet(title, body, mount) {
  let old = null;
  if (sheetEl) old = $('.sheet:not(.leaving)', sheetEl);
  else {
    sheetEl = document.createElement('div');
    sheetEl.className = 'backdrop';
    const bd = sheetEl;
    bd.addEventListener('click', e => { if (e.target === bd) closeSheet(); });
    document.body.appendChild(bd);
    document.body.style.overflow = 'hidden';
  }
  sheetRefresh = null;
  const tmp = document.createElement('div');
  tmp.innerHTML = `<div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="grab"></div>
    <h3><span>${esc(title)}</span><button class="btn ghost x" data-act="close">${T('Fermer', 'Close')}</button></h3><div class="sheet-body">${body}</div></div>`;
  const sheet = tmp.firstElementChild;
  // La nouvelle feuille entre pendant que l'ancienne s'en va
  if (old) sheetOut(old);
  sheet.style.animation = 'none';
  sheetEl.prepend(sheet);
  // Elle grandit depuis l'élément touché (sinon depuis le bas de l'écran)
  const r = sheet.getBoundingClientRect();
  const pt = tapPoint && Date.now() - tapPoint.t < 1500 ? tapPoint : { x: innerWidth / 2, y: innerHeight };
  sheet.style.transformOrigin = `${Math.round(pt.x - r.left)}px ${Math.round(pt.y - r.top)}px`;
  void sheet.offsetWidth;
  sheet.style.animation = '';
  if (mount) mount(sheet);
  $$('.seg', sheet).forEach(g => syncPill(g, false));
  reveal([...$('.sheet-body', sheet).children].slice(0, 8), 40);
  staggerLists(sheet);
}
// Sortie vers le même point d'origine
function sheetOut(sh) {
  sh.classList.add('leaving'); sh.inert = true; sh.setAttribute('aria-hidden', 'true');
  sh.querySelectorAll('[id]').forEach(n => n.removeAttribute('id'));
  later(() => sh.remove(), T_OUT + 40);
}
function closeSheet() {
  if (!sheetEl) return;
  const bd = sheetEl;
  sheetEl = null; sheetRefresh = null; document.body.style.overflow = '';
  $$('.sheet', bd).forEach(sheetOut);
  bd.classList.add('leaving');
  later(() => bd.remove(), T_OUT + 40);
}
const segHTML = (name, val) => `<div class="seg" role="group" aria-label="${T('Mesuré avec', 'Measured with')}" data-seg="${name}">
  ${Object.entries(SP().sources).map(([k, l]) => `<button type="button" data-val="${k}" aria-pressed="${val === k}">${l}</button>`).join('')}</div>`;
const segVal = (root, name) => { const b = $(`[data-seg="${name}"] [aria-pressed="true"]`, root); return b ? b.dataset.val : null; };
function wireSeg(root) {
  $$('[data-seg] button, .rpe button', root).forEach(b => b.addEventListener('click', () => {
    const wasOn = b.getAttribute('aria-pressed') === 'true';
    $$('button', b.parentElement).forEach(x => x.setAttribute('aria-pressed', 'false'));
    b.setAttribute('aria-pressed', b.parentElement.classList.contains('rpe') && wasOn ? 'false' : 'true');
    if (b.parentElement.classList.contains('seg')) syncPill(b.parentElement, true);
    b.parentElement.dispatchEvent(new Event('input', { bubbles: true }));
  }));
}
async function persist(table, id, row, msg, event, after) {
  try {
    const before = bestMarks();
    const saved = id ? await Store().update(table, id, row) : await Store().insert(table, row);
    await loadAll();
    if (typeof event === 'function') state.mascotEvent = event(before);
    closeSheet(); render(); toast(msg, true);
    if (typeof after === 'function' && saved && saved.id) after(saved);
  } catch (e) { const er = $('.sheet:not(.leaving) .err'); if (er) er.textContent = T('Pas enregistré : ', 'Not saved: ') + (e.message || T('erreur réseau', 'network error')) + T('. Réessaie.', '. Try again.'); }
}
async function destroy(table, id, what) {
  if (!confirm(T(`Supprimer ${what} ? C'est définitif.`, `Delete ${what}? This can't be undone.`))) return;
  try { await Store().remove(table, id); await loadAll(); closeSheet(); render(); toast(T('Supprimé', 'Deleted')); }
  catch (e) { toast(T('Suppression impossible : ', "Couldn't delete: ") + (e.message || T('erreur', 'error'))); }
}

function validProto(p, k) {
  const L = SP(k).lim;
  return !!p && num(p.start) >= L.start[0] && num(p.start) <= L.start[1] && num(p.step) >= L.step[0] && num(p.step) <= L.step[1] && num(p.n) >= 3 && num(p.n) <= 15;
}
function derivedProto() {
  const last = state.tests.filter(t => t.kind === 'steps').sort(byDateDesc)[0];
  const st = last ? analyzeSteps(last).steps : [];
  if (st.length < 3) return null;
  const diffs = st.slice(1).map((s, i) => rnd(s.w - st[i].w)).sort((a, b) => a - b);
  const p = { start: st[0].w, step: diffs[Math.floor(diffs.length / 2)], n: st.length };
  return validProto(p) ? p : null;
}
const proto = () => state.protos[state.sport] || derivedProto() || SP().proto;
function matchesProto(steps, p) {
  const eq = (a, b) => Math.abs(a - b) < 1e-6;
  return steps.length > 0 && eq(steps[0].w, p.start) && steps.every((s, i) => i === 0 || eq(s.w - steps[i - 1].w, p.step));
}

}

/* Test paliers : détail + choix manuel de LT1 ou LT2 */
// Golden Zone lue sur un test donné, plafonnée à son LT2
function testGZ(a) {
  const { lo, hi } = state.gz;
  let wLo = crossW(a.steps, lo), wHi = crossW(a.steps, hi);
  if (wLo != null && wHi == null && a.lt2W != null) wHi = a.lt2W;
  if (wHi != null && a.lt2W != null && wHi > a.lt2W) wHi = a.lt2W;
  if (wLo == null || wHi == null || wHi <= wLo) return null;
  return { wLo, wHi, hrLo: interpHr(a.steps, wLo), hrHi: interpHr(a.steps, wHi) };
}

  { id: 'd-short', name: 'Intervalles courts GZ', reps: 10, work: 180, rest: 60, target: 'Golden Zone' }

const TARGETS = { 'Golden Zone': 'Golden Zone', 'Intervalles': 'Autre intensité' };

function parseDur(v) {
  const s = String(v == null ? '' : v).trim().toLowerCase().replace(',', '.');
  let m;
  if (!s) return null;
  if ((m = /^(\d+):(\d{1,2})$/.exec(s))) return +m[1] * 60 + +m[2];
  if ((m = /^(\d+(?:\.\d+)?)\s*(s|sec|secondes?)$/.exec(s))) return Math.round(+m[1]);
  if ((m = /^(\d+(?:\.\d+)?)\s*(min|mn|m|')?$/.exec(s))) return Math.round(+m[1] * 60);
  return null;
}
function fmtDur(sec) {
  if (sec == null) return '';
  if (sec < 60) return `${sec} s`;
  const m = Math.floor(sec / 60), r = sec % 60;
  return r ? `${m} min ${String(r).padStart(2, '0')}` : `${m} min`;
}
const tgtLabel = k => (k === 'Intervalles' ? T(TARGETS[k], 'Other intensity') : TARGETS[k] ? kindLabel(TARGETS[k]) : kindLabel(k));

    <p class="muted" style="font-size:13px;margin:12px 0 0">${T(`Paliers de 5 min, +${P.step} W, ${P.n} paliers, 30 s de pause pour le lactate. Sur ordinateur, copie le fichier dans Documents/Zwift/Workouts/ puis ton numéro Zwift ; il apparaît dans Entraînements, catégorie Custom Workouts.`,
      `5 min steps, +${P.step} W, ${P.n} steps, 30 s lactate pause. On a computer, copy the file into Documents/Zwift/Workouts/ then your Zwift ID folder; it shows up under Workouts, in Custom Workouts.`)}</p>`, root => {
    const upd = () => {
      const st = num($('#z-start', root).value), pv = $('#z-preview', root);
      if (!st || st < 50 || st > 500) { pv.innerHTML = `<span class="hand">${T('Entre un départ entre 50 et 500 W.', 'Enter a start between 50 and 500 W.')}</span>`; return; }
      const z = zwoSteps(1, Math.round(st), false);
      pv.innerHTML = `<div class="tpl-steps">${z.steps.map((w, i) => `<span class="chip">${i + 1}. <b>${w} W</b></span>`).join('')}</div>`;
    };
    root.addEventListener('input', upd); upd();
  });
}
function zwiftDownload(root) {
  const st = num($('#z-start', root).value);
  if (!st || st < 50 || st > 500) { $('.err', root).textContent = T('Départ entre 50 et 500 W attendu.', 'Start between 50 and 500 W expected.'); return; }
  const start = Math.round(st), P = proto(), ref = start + (P.n - 1) * P.step;
  const z = zwoSteps(ref, start, true);
  downloadFile(z.file, z.xml, 'application/xml');
  toast(T('Fichier prêt pour Zwift', 'File ready for Zwift'), true);
}
async function rouvyDownload(root, id, f) {
  const err = m => { $('.err', root).textContent = m; };
  const t = id === 'steps' ? null : templates().find(x => x.id === id);
  if (f === 'zwo') {
    const v = num($('#r-ftp', root).value);
    if (!v || v < 80 || v > 600) return err(T('FTP entre 80 et 600 W attendue.', 'FTP between 80 and 600 W expected.'));
    const ftp = Math.round(v);
    await saveFtp(ftp);
    const z = t ? zwoTemplate(t, ftp) : zwoSteps(ftp);
    downloadFile(z.file, z.xml, 'application/xml');
  } else if (!t) {
    const st = num($('#r-start', root).value);
    if (!st || st < 50 || st > 500) return err(T('Départ entre 50 et 500 W attendu.', 'Start between 50 and 500 W expected.'));
    const e = ergSteps(Math.round(st));
    downloadFile(e.file, e.text, 'text/plain');
  } else {
    const w = num($('#r-w', root).value);
    if (!w || w < 50 || w > 600) return err(T('Watts entre 50 et 600 attendus.', 'Watts between 50 and 600 expected.'));
    const e = ergTemplate(t, Math.round(w));
    downloadFile(e.file, e.text, 'text/plain');
  }
  toast(T('Fichier prêt pour Rouvy', 'File ready for Rouvy'), true);
}

/* ---------- Comptes : email + mot de passe ---------- */
const SITE_URL = location.origin + location.pathname;
const EMAIL_RE = /^\S+@\S+\.\S+$/;
function renderLogin(mode, email = '', info = '') {
  if (!mode) mode = localStorage.getItem('globule:has-account') ? 'login' : 'signup';
  $('#tabbar').hidden = true;
  const emailF = `<label class="field"><span>${T('Email', 'Email')}</span><input class="inp" id="l-email" type="email" autocomplete="email" inputmode="email" value="${esc(email)}"></label>`;
  const tabs = (mode === 'signup' || mode === 'login') ? `<div class="seg" data-layout-id="auth" style="margin-bottom:14px">
      <button data-act="auth-mode" data-mode="signup" aria-pressed="${mode === 'signup'}">${T('Créer un compte', 'Create account')}</button>
      <button data-act="auth-mode" data-mode="login" aria-pressed="${mode === 'login'}">${T('Me connecter', 'Log in')}</button></div>` : '';
  let body = '';
  if (mode === 'signup') body = `<p class="hand" style="margin-top:0">${T('Salut ! Crée ton compte : tes tests et tes séances restent à toi.', 'Hi! Create your account: your tests and sessions stay yours.')}</p>
      <label class="field"><span>${T('Prénom', 'First name')}</span><input class="inp" id="l-name" autocomplete="given-name"></label>${emailF}
      <label class="field"><span>${T('Mot de passe (8 caractères minimum)', 'Password (8 characters minimum)')}</span><input class="inp" id="l-pass" type="password" autocomplete="new-password"></label>
      <button class="btn rose block" data-act="signup" data-main>${T('Créer mon compte', 'Create my account')}</button>`;
  else if (mode === 'login') body = `<p class="hand" style="margin-top:0">${T('Re-salut ! Connecte-toi pour retrouver tes gouttes.', 'Hi again! Log in to get your drops back.')}</p>${emailF}
      <label class="field"><span>${T('Mot de passe', 'Password')}</span><input class="inp" id="l-pass" type="password" autocomplete="current-password"></label>
      <button class="btn rose block" data-act="login" data-main>${T('Me connecter', 'Log in')}</button>
      <div style="height:10px"></div><button class="btn ghost block" data-act="auth-mode" data-mode="forgot">${T('Mot de passe oublié ?', 'Forgot password?')}</button>`;
  else if (mode === 'forgot') body = `<p class="hand" style="margin-top:0">${T('Ton email, et je t\'envoie un lien pour choisir un nouveau mot de passe.', "Your email, and I'll send you a link to pick a new password.")}</p>${emailF}
      <button class="btn rose block" data-act="forgot" data-main>${T('Recevoir le lien', 'Send me the link')}</button>
      <div style="height:10px"></div><button class="btn ghost block" data-act="auth-mode" data-mode="login">${T('Retour', 'Back')}</button>`;
  else if (mode === 'reset') body = `<p class="hand" style="margin-top:0">${T('Choisis ton nouveau mot de passe.', 'Pick your new password.')}</p>
      <label class="field"><span>${T('Nouveau mot de passe (8 caractères minimum)', 'New password (8 characters minimum)')}</span><input class="inp" id="l-pass" type="password" autocomplete="new-password"></label>
      <button class="btn rose block" data-act="reset" data-main>${T('Enregistrer', 'Save')}</button>`;
  else if (mode === 'check') body = `<p class="hand" style="margin-top:0">${esc(info)}</p>
      <button class="btn rose block" data-act="auth-mode" data-mode="login" data-email="${esc(email)}">${T('Aller à la connexion', 'Go to log in')}</button>`;
  app().innerHTML = `<div class="login"><div class="login-lang">${langSwitch()}</div>${globuleSVG(200)}<h1 class="wordmark" style="font-size:40px;margin-top:10px">Globule</h1>
    <section class="panel">${tabs}${body}<p class="err" role="alert"></p></section></div>`;
  setMascot($('#app .globule'), 'hello');
  $$('.login .seg').forEach(g => syncPill(g, true));
  reveal($$('.login .panel > :not(.seg)'));
  document.title = T('Globule, labo lactate', 'Globule, lactate lab');
}
function showErr(msg) { const e = $('.login .err'); if (e) e.textContent = msg; $$('.login [data-main]').forEach(b => { b.disabled = false; }); }
function authErr(e) {
  const m = ((e && e.message) || '').toLowerCase();
  if (m.includes('invalid login')) return T('Email ou mot de passe incorrect.', 'Wrong email or password.');
  if (m.includes('already registered') || m.includes('already been registered')) return T('Ce compte existe déjà : connecte-toi.', 'This account already exists: log in.');
  if (m.includes('not confirmed')) return T("Confirme d'abord ton email avec le lien reçu (regarde aussi dans les spams).", 'Confirm your email first with the link you got (check your spam too).');
  if (m.includes('rate limit') || m.includes('too many')) return T('Trop d’essais d’un coup. Réessaie dans quelques minutes.', 'Too many tries at once. Try again in a few minutes.');
  if (m.includes('password')) return T('Mot de passe refusé : 8 caractères minimum.', 'Password rejected: 8 characters minimum.');
  return (e && e.message) || T('Erreur réseau, réessaie.', 'Network error, try again.');
}
const readAuth = () => ({ email: ($('#l-email') ? $('#l-email').value : '').trim(), pass: $('#l-pass') ? $('#l-pass').value : '', name: ($('#l-name') ? $('#l-name').value : '').trim() });
async function signUp() {
  const { email, pass, name } = readAuth();
  if (!name) return showErr(T('Ton prénom ?', 'Your first name?'));
  if (!EMAIL_RE.test(email)) return showErr(T('Cet email ne ressemble pas à un email.', "That email doesn't look like an email."));
  if (pass.length < 8) return showErr(T('Le mot de passe fait au moins 8 caractères.', 'The password needs at least 8 characters.'));
  const { data, error } = await sb.auth.signUp({ email, password: pass, options: { data: { name }, emailRedirectTo: SITE_URL } });
  if (error) return showErr(authErr(error));
  if (data.session) return enter(data.session.user);
  if (data.user && Array.isArray(data.user.identities) && data.user.identities.length === 0) { renderLogin('login', email); return showErr(T('Ce compte existe déjà : connecte-toi.', 'This account already exists: log in.')); }
  localStorage.setItem('globule:has-account', '1');
  renderLogin('check', email, T(`Presque fini, ${name} ! Clique sur le lien envoyé à ${email} pour confirmer ton compte (regarde aussi dans les spams), puis connecte-toi.`, `Almost done, ${name}! Click the link sent to ${email} to confirm your account (check your spam too), then log in.`));
}
async function logIn() {
  const { email, pass } = readAuth();
  if (!EMAIL_RE.test(email) || !pass) return showErr(T('Ton email et ton mot de passe, s’il te plaît.', 'Your email and password, please.'));
  const { data, error } = await sb.auth.signInWithPassword({ email, password: pass });
  if (error) return showErr(authErr(error));
  enter(data.user);
}
async function forgotPass() {
  const { email } = readAuth();
  if (!EMAIL_RE.test(email)) return showErr(T('Cet email ne ressemble pas à un email.', "That email doesn't look like an email."));
  const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: SITE_URL });
  if (error) return showErr(authErr(error));
  renderLogin('check', email, T(`Si un compte existe pour ${email}, un lien vient de partir. Ouvre-le pour choisir un nouveau mot de passe.`, `If an account exists for ${email}, a link is on its way. Open it to pick a new password.`));
}
async function resetPass() {
  const { pass } = readAuth();
  if (pass.length < 8) return showErr(T('Le mot de passe fait au moins 8 caractères.', 'The password needs at least 8 characters.'));
  const { data, error } = await sb.auth.updateUser({ password: pass });
  if (error) return showErr(authErr(error));
  toast(T('Mot de passe changé', 'Password changed'));
  enter(data.user);
}
function enter(user) {
  try { localStorage.setItem('globule:has-account', '1'); } catch { /* stockage bloqué */ }
  if (location.hash) history.replaceState(null, '', SITE_URL);
  state.user = user; state.name = (user.user_metadata && user.user_metadata.name) || '';
  loadGz(user); loadProto(user); loadSports(user.user_metadata); loadTemplates(user.user_metadata && user.user_metadata.templates);
  start();
}

/* ---------- Événements ---------- */
document.addEventListener('click', async e => {
  const tab = e.target.closest('[data-tab]');
  if (tab) { switchTab(tab.dataset.tab); return; }
  const el = e.target.closest('[data-act]'); if (!el) return;
  const act = el.dataset.act, id = el.dataset.id, root = $('.sheet:not(.leaving)');
  switch (act) {
    case 'close': closeSheet(); break;
    case 'set-lang': setLang(el.dataset.val); break;
    case 'share-app': shareApp(); break;
    case 'a2hs': a2hsTuto(); break;
    case 'a2hs-pf': a2hsTuto(el.dataset.val, 0); break;
    case 'a2hs-go': a2hsTuto(el.dataset.pf, +el.dataset.i); break;
    case 'set-sport': if (SPORTS[el.dataset.val] && el.dataset.val !== state.sport) { state.sport = el.dataset.val; try { localStorage.setItem('globule:sport', state.sport); } catch (e) {} applySport(); render(); } break;
    case 'edit-sports': profileSheet(false); break;
    case 'toggle-sport': {
      const sel = JSON.parse(root.dataset.sel || '[]'), k = el.dataset.val, i = sel.indexOf(k);
      if (i >= 0) sel.splice(i, 1); else sel.push(k);
      sel.sort((a, b) => Object.keys(SPORTS).indexOf(a) - Object.keys(SPORTS).indexOf(b));
      root.dataset.sel = JSON.stringify(sel);
      $$('[data-act="toggle-sport"]', root).forEach(b => { const on = sel.includes(b.dataset.val); b.setAttribute('aria-pressed', on); b.classList.toggle('violet', on); });
      break;
    }
    case 'save-sports': {
      const sel = JSON.parse(root.dataset.sel || '[]');
      if (!sel.length) { $('.err', root).textContent = T('Choisis au moins un sport.', 'Pick at least one sport.'); break; }
      if (!sel.includes(state.sport)) state.sport = sel[0];
      if (await saveSports(sel)) { closeSheet(); render(); toast(sel.map(k => SPORTS[k].label).join(T(' et ', ' and ')), true); }
      break;
    }
    case 'new-session': pickSession(); break;
    case 'edit-session': { const ss = state.sessions.find(s => s.id === id); if (ss && ss.template) intervalForm(null, ss); else sessionForm(ss); break; }
    case 'use-tpl': { const t = templates().find(x => x.id === id); if (t) intervalForm(t); break; }
    case 'new-tpl': tplForm(); break;
    case 'save-tpl': el.disabled = true; await saveTpl(root); el.disabled = false; break;
    case 'del-tpl': delTpl(id); break;
    case 'add-iv': addIv(root); break;
    case 'save-iv': saveIntervals(root); break;
    case 'save-session': saveSession(root); break;
    case 'del-session': destroy('sessions', id, T('cette séance', 'this session')); break;
    case 'new-steps': stepForm(); break;
    case 'open-steps': state.pick = 'lt1'; stepDetail(id); break;
    case 'edit-steps': stepForm(state.tests.find(t => t.id === id)); break;
    case 'save-steps': saveSteps(root); break;
    case 'add-row': {
      const rows = $('#rows', root), last = $$('.step-row [data-k="w"]', rows).map(i => ({ w: num(i.value) })).filter(s => s.w != null).pop();
      const n = $$('.step-row', rows).length;
      rows.insertAdjacentHTML('beforeend', stepRow({ w: last ? last.w + proto().step : proto().start }, n));
      $('.step-row:last-child [data-k="hr"]', rows).focus();
      break;
    }
    case 'del-row': {
      el.closest('.step-row').remove();
      $$('.step-row .n', root).forEach((n, i) => { n.textContent = i + 1; });
      if (sheetRefresh) sheetRefresh();
      break;
    }
    case 'pick': state.pick = el.dataset.mode === 'lt2' ? 'lt2' : 'lt1'; stepDetail(id); break;
    case 'set-thr': setThr(id, state.pick === 'lt2' ? 'lt2_manual' : 'lt1_manual', num(el.dataset.w)); break;
    case 'reset-thr': setThr(id, el.dataset.field === 'lt2_manual' ? 'lt2_manual' : 'lt1_manual', null); break;
    case 'del-test': destroy('tests', id, T('ce test', 'this test')); break;
    case 'save-name': {
      const name = $('#set-name').value.trim().slice(0, 40);
      state.name = name;
      if (DEMO) localStorage.setItem('globule:name', name);
      else { const { error } = await sb.auth.updateUser({ data: { name } }); if (error) { toast(T('Pas enregistré : ', 'Not saved: ') + error.message); break; } }
      render(); toast(name ? T(`Salut ${name} !`, `Hi ${name}!`) : T('Prénom effacé', 'First name cleared'));
      break;
    }
    case 'new-gz': pickSession(); break;
    case 'save-proto': {
      const P = { start: rnd(num($('#set-p-start').value)), step: rnd(num($('#set-p-step').value)), n: Math.round(num($('#set-p-n').value)) };
      const L = SP().lim;
      if (!validProto(P)) { toast(T(`Protocole invalide : départ ${fx(L.start[0])} à ${fxu(L.start[1])}, +${fx(L.step[0])} à ${fxu(L.step[1])}, 3 à 15 paliers`, `Invalid protocol: start ${fx(L.start[0])} to ${fxu(L.start[1])}, +${fx(L.step[0])} to ${fxu(L.step[1])}, 3 to 15 steps`)); break; }
      state.protos[state.sport] = P;
      const key = isRun() ? 'protoRun' : 'proto';
      if (DEMO) localStorage.setItem(isRun() ? 'globule:proto-run' : 'globule:proto', JSON.stringify(P));
      else { const { error } = await sb.auth.updateUser({ data: { [key]: P } }); if (error) { toast(T('Pas enregistré : ', 'Not saved: ') + error.message); break; } }
      render(); toast(T(`Protocole : ${fxu(P.start)}, +${fxu(P.step)}, ${P.n} paliers`, `Protocol: ${fxu(P.start)}, +${fxu(P.step)}, ${P.n} steps`));
      break;
    }
    case 'save-gz': {
      const v = id => num($(id).value);
      const gz = { lo: v('#set-gz-lo'), hi: v('#set-gz-hi') };
      if (!validGz(gz)) { toast(T('Plage invalide : "de" plus petit que "à", entre 0,5 et 10 mmol', 'Invalid range: "from" lower than "to", between 0.5 and 10 mmol')); break; }
      state.gz = gz;
      if (DEMO) localStorage.setItem('globule:gz3', JSON.stringify(gz));
      else { const { error } = await sb.auth.updateUser({ data: { gz3: gz } }); if (error) { toast(T('Pas enregistré : ', 'Not saved: ') + error.message); break; } }
      render(); toast(T('Golden Zone enregistrée', 'Golden Zone saved'));
      break;
    }
    case 'export': exportCSV(); break;
    case 'rouvy': rouvySheet(id); break;
    case 'zwift': zwiftSheet(); break;
    case 'zwift-dl': zwiftDownload(root); break;
    case 'rouvy-dl': rouvyDownload(root, id, el.dataset.fmt); break;
    case 'rouvy-fmt': rouvySheet(id, el.dataset.val); break;
    case 'reset-demo':
      if (confirm(T('Vider toutes les données de démo de cet appareil ?', 'Clear all demo data from this device?'))) { ['tests', 'sessions'].forEach(t => localStorage.removeItem('globule:' + t)); state.tests = []; state.sessions = []; render(); }
      break;
    case 'logout': await sb.auth.signOut(); state.user = null; state.tests = []; state.sessions = []; renderLogin('login'); break;
    case 'auth-mode': renderLogin(el.dataset.mode, el.dataset.email || readAuth().email); break;
    case 'signup': el.disabled = true; await signUp(); break;
    case 'login': el.disabled = true; await logIn(); break;
    case 'forgot': el.disabled = true; await forgotPass(); break;
    case 'reset': el.disabled = true; await resetPass(); break;
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeSheet();
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('.chart .hit')) { e.preventDefault(); e.target.dispatchEvent(new MouseEvent('click', { bubbles: true })); }
  if (e.key === 'Enter' && e.target.closest('.login .inp')) { e.preventDefault(); const b = $('.login [data-main]'); if (b && !b.disabled) b.click(); }
});

/* ---------- Démarrage ---------- */
async function start() {
  $('#tabbar').hidden = false;
  app().innerHTML = header() + hero(T('Je remonte tes gouttes...', 'Fetching your drops...'), 124);
  try { await loadAll(); render(); if (!state.sports) profileSheet(true); else maybeA2hs(); }
  catch (e) {
    app().innerHTML = header() + hero(T('Impossible de récupérer tes données. Vérifie ta connexion.', "Couldn't load your data. Check your connection."), 124) + `<button class="btn rose block" onclick="start()">${T('Réessayer', 'Try again')}</button><p class="err">${esc(e.message || '')}</p>`;
  }
}
function validGz(g) { return !!g && num(g.lo) >= 0.5 && num(g.hi) > num(g.lo) && num(g.hi) <= 10; }
function loadProto(u) {
  const m = (u && u.user_metadata) || {};
  const pick = (p, k) => (validProto(p, k) ? { start: num(p.start), step: num(p.step), n: num(p.n) } : null);
  state.protos = { bike: pick(m.proto, 'bike'), run: pick(m.protoRun, 'run') };
}
function loadGz(u) { const g = u && u.user_metadata && u.user_metadata.gz3; state.gz = validGz(g) ? { lo: num(g.lo), hi: num(g.hi) } : { ...GZ_DEFAULT }; }
async function boot() {
  if (DEMO) {
    seedDemo();
    state.name = localStorage.getItem('globule:name') || '';
    try { const g = JSON.parse(localStorage.getItem('globule:gz3') || 'null'); if (validGz(g)) state.gz = { lo: num(g.lo), hi: num(g.hi) }; } catch { /* plages par défaut */ }
    try { const pr = JSON.parse(localStorage.getItem('globule:proto') || 'null'); if (validProto(pr, 'bike')) state.protos.bike = pr; } catch { /* protocole déduit */ }
    try { const pr = JSON.parse(localStorage.getItem('globule:proto-run') || 'null'); if (validProto(pr, 'run')) state.protos.run = pr; } catch { /* protocole déduit */ }
    try { loadSports({ sports: JSON.parse(localStorage.getItem('globule:sports') || 'null') }); } catch { loadSports(null); }
    try { loadTemplates(JSON.parse(localStorage.getItem('globule:templates') || '[]')); } catch { /* pas de modèles perso */ }
    return start();
  }
  const recovery = /type=recovery/.test(location.hash);
  sb = window.supabase.createClient(CFG.supabaseUrl, CFG.supabaseAnonKey, { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true } });
  sb.auth.onAuthStateChange(ev => { if (ev === 'PASSWORD_RECOVERY') setTimeout(() => renderLogin('reset'), 0); });
  const { data } = await sb.auth.getSession();
  if (recovery && data.session) { history.replaceState(null, '', SITE_URL); return renderLogin('reset'); }
  if (!data.session) {
    const m = /error_description=([^&]+)/.exec(location.hash);
    if (location.hash) history.replaceState(null, '', SITE_URL);
    renderLogin();
    if (m) showErr(T('Lien expiré ou déjà utilisé. ', 'Link expired or already used. ') + decodeURIComponent(m[1].replace(/\+/g, ' ')));
    return;
  }
  enter(data.session.user);
}
boot();
